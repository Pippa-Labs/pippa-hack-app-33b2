# Charged: should I e-bike this London trip, which bike, and is it worth it?
#
# The app keeps nothing between calls and is told nothing about who is asking.
# Everything it needs (where from, where to, any budget) comes from the
# message, and every live figure comes from a public feed:
#   Lime's public GBFS feed, TfL's Unified API (Santander Cycles docks and the
#   Journey Planner), Open-Meteo (forecast and elevation), and Nominatim
#   (OpenStreetMap) to turn place names into coordinates.

manifest_version: 1

persistence: none

app_author_name: "fdb06"

app:
  id: hack.app_33b2
  name: Charged
  version: 0.1.0
  # Never use the word "by" here: the badge is parsed on it.
  summary: >-
    Live check of Lime and Santander e-bikes, their battery, and whether an
    e-bike beats the tube or bus in London. It picks a bike with enough charge
    for the distance, hills and wind, checks rain on the ride and any weekly
    travel budget you mention, and sends only place names and coordinates to
    TfL, Lime, Open-Meteo and OpenStreetMap.

agent_types:
  - personal

outcomes:
  - id: ebike.trip
    summary: Live e-bike battery and dock check against the tube or bus for a London trip
    example_phrases:
      - should i get an e-bike or the tube
      - find a lime bike with enough battery
      - is there a santander e-bike near
      - is it quicker to cycle or take the tube
      - lime bike or bus to get to
      - will a lime e-bike manage the hill
      - cheapest way there on an e-bike
      - e-bike or tube to get there
    inputs:
      - name: origin
        type: string
        required: false
        description: >-
          Where the trip starts, as the user wrote it: a London place, street,
          station or postcode, for example "South Kensington" or "Imperial
          College". If the message does not say where they are starting from,
          return an empty string rather than guessing.
      - name: destination
        type: string
        required: false
        description: >-
          Where the trip ends, as the user wrote it: a London place, street,
          station or postcode, for example "Camden Market". If the message
          does not name a destination, return an empty string rather than
          guessing.
      - name: budget_left_gbp
        type: number
        required: false
        description: >-
          How much money, in pounds, the user says they have left to spend on
          travel, if they said. Leave this out entirely if they did not
          mention a budget. Never guess an amount.
      - name: days_left
        type: integer
        required: false
        description: >-
          How many days that travel budget has to last, if the user said (for
          example "3 days left this week" means 3). Leave this out entirely if
          they did not say. Never guess.
      - name: fare_cap_reached
        type: boolean
        required: false
        description: >-
          True only if the user says they have already hit their TfL daily or
          weekly fare cap, so more bus and tube trips are free for them. Leave
          this out entirely if they did not mention it.
      - name: has_lime_prime
        type: boolean
        required: false
        description: >-
          True only if the user says they have a LimePrime (Lime subscription).
          Leave this out entirely if they did not mention it.
      - name: santander_member
        type: boolean
        required: false
        description: >-
          True only if the user says they have a Santander Cycles monthly or
          annual membership. Leave this out entirely if they did not mention it.
    output:
      - name: verdict
        type: string
        description: "lime, santander or public_transport: the way to travel."
      - name: summary
        type: string
        description: Two or three plain sentences explaining the choice.
      - name: origin
        type: string
        description: The start place as it was found on the map.
      - name: destination
        type: string
        description: The destination as it was found on the map.
      - name: trip_km
        type: number
        description: Estimated riding distance in kilometres.
      - name: bike_operator
        type: string
        required: false
        description: The e-bike scheme picked, Lime or Santander Cycles.
      - name: bike_pickup
        type: string
        required: false
        description: Where to get the bike (walk time and direction, or the dock name).
      - name: bike_range_km
        type: number
        required: false
        description: Battery range left on the picked Lime e-bike, in kilometres.
      - name: range_needed_km
        type: number
        required: false
        description: Range the trip needs once hills, wind and a safety margin are added.
      - name: low_battery_bikes_skipped
        type: integer
        required: false
        description: Closer Lime e-bikes skipped because their battery was too low.
      - name: bike_minutes
        type: integer
        required: false
        description: Door-to-door minutes on the e-bike, walking included.
      - name: bike_cost_gbp
        type: number
        required: false
        description: Estimated e-bike cost in pounds.
      - name: parking
        type: string
        required: false
        description: Where the bike can be left near the destination.
      - name: transit_minutes
        type: integer
        required: false
        description: Door-to-door minutes on the tube, bus or train, from TfL's Journey Planner.
      - name: transit_route
        type: string
        required: false
        description: The fastest public transport route, for example "bus 14, then Northern line".
      - name: cheaper_transit
        type: string
        required: false
        description: A cheaper route that is at most 10 minutes slower, with its time and fare.
      - name: transit_cost_gbp
        type: number
        required: false
        description: Pay-as-you-go fare in pounds from TfL, zero if the fare cap is reached.
      - name: climb_m
        type: number
        required: false
        description: Height gained from start to destination, in metres (negative means downhill).
      - name: headwind_kmh
        type: number
        required: false
        description: Wind against the rider in km/h (negative means a tailwind).
      - name: rain
        type: string
        required: false
        description: What the rain forecast means for the ride.
      - name: budget_note
        type: string
        required: false
        description: How the trip fits the travel budget the user mentioned.
      - name: subscription_tip
        type: string
        required: false
        description: >-
          What the ride would cost with LimePrime or a Santander membership,
          when the user did not say whether they have one. Ask them.
      - name: data_note
        type: string
        description: Which feeds answered, and what the estimates assume.
